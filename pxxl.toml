# Pxxl routing for smartlify.xyz.
#
# Pxxl treats this file as canonical and ignores vercel.json when it is present.
# That matters because vercel.json rewrites the SPA fallback to `/index`, which
# is Vercel's clean-URL form; Pxxl expects `/index.html`. Keeping routing here
# means the same repository deploys correctly on both platforms.
version = 1

[routing]
spa = true

# Hashed build assets never change, so cache them for a year.
[[headers]]
source = "/assets/:path*"
[headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
